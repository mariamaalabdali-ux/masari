<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f0e8"><title>مساري | تقنية رقمية 3</title><style>
:root{--bg:#f7f0e8;--card:#fffaf5;--ink:#2e302c;--muted:#74756f;--terr:#c65f48;--peach:#edaa82;--sage:#7e9b78;--green:#386e5b;--gold:#d6a348;--plum:#88647d;--line:#eadbcf;--shadow:0 14px 40px rgba(87,60,44,.11)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f4eadf,#faf7f1);font-family:Tahoma,Arial,sans-serif;color:var(--ink);min-height:100dvh}button{font:inherit}.app{width:100%;max-width:460px;margin:auto;min-height:100dvh;background:rgba(255,250,245,.92);position:relative;padding-bottom:calc(92px + env(safe-area-inset-bottom))}header{padding:calc(18px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;gap:10px;align-items:center}.brand h1{margin:0;font-size:31px;color:#263e34}.brand p{margin:3px 0;color:var(--muted);font-size:12px}.leaf{color:var(--sage)}.ghost{border:1px solid var(--line);background:#fff8f1;border-radius:14px;padding:9px 12px;color:var(--terr);white-space:nowrap}main{padding:8px 14px 24px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.hero{padding:24px;background:radial-gradient(circle at 20% 10%,#f7c9b2 0,transparent 34%),linear-gradient(145deg,#fffaf5,#f1e7d8)}.hero h2{font-size:25px;margin:0 0 8px}.hero p{color:var(--muted);line-height:1.9}.cta{width:100%;border:0;border-radius:17px;padding:15px 18px;background:linear-gradient(135deg,var(--terr),#b94d3d);color:white;font-weight:700;margin-top:14px;cursor:pointer}.secondary{background:#edf1e7;color:#355445}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.tile{border:0;text-align:right;padding:16px;border-radius:20px;min-height:112px;box-shadow:var(--shadow);cursor:pointer}.tile b{display:block;font-size:17px;margin:8px 0}.tile small{color:#565b54}.pink{background:#f8d7cf}.sage{background:#dce7d4}.gold{background:#f5e2b9}.blue{background:#dce8e6}.section-title{font-size:20px;margin:22px 2px 12px}.lesson{padding:16px;margin:9px 0;display:flex;gap:10px;align-items:center;cursor:pointer}.num{width:34px;height:34px;border-radius:12px;background:#f2d1c3;display:grid;place-items:center;color:#9e4938;font-weight:bold;flex:0 0 auto}.lesson span{flex:1}.q{padding:18px}.q h3{line-height:1.8}.option{display:block;width:100%;text-align:right;border:1px solid var(--line);background:white;padding:14px;border-radius:14px;margin:9px 0;cursor:pointer}.progressbar{height:8px;background:#eadfd4;border-radius:10px;overflow:hidden;margin:8px 0 18px}.progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--terr))}.score{width:150px;height:150px;border-radius:50%;margin:20px auto;display:grid;place-items:center;background:conic-gradient(var(--terr) var(--p),#eee2d8 0);position:relative}.score:after{content:'';position:absolute;inset:14px;background:var(--card);border-radius:50%}.score strong{z-index:1;font-size:34px}.path{padding:18px;margin:12px 0;border-radius:20px}.path h3{margin:0 0 8px}.path.discover{background:#f8d5cd}.path.apply{background:#dfe8d7}.path.innovate{background:#eaddea}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#fff8f2;color:var(--terr);font-size:12px}.stage3d{height:300px;position:relative;margin:15px 0;background:radial-gradient(circle,#fff 0,#f2e7da 70%);border-radius:28px;overflow:hidden;perspective:700px}.core{position:absolute;inset:0;margin:auto;width:100px;height:100px;border-radius:50%;background:#31443d;color:white;display:grid;place-items:center;text-align:center;box-shadow:0 18px 30px #0002}.stage{position:absolute;width:82px;padding:10px 5px;text-align:center;border:0;border-radius:14px;color:white;font-size:12px;box-shadow:0 10px 18px #0002;transition:.2s;cursor:pointer}.stage:active{transform:scale(.96)}.s1{top:18px;left:50%;translate:-50%;background:#3c8a6b}.s2{top:65px;right:18px;background:#d7904c}.s3{top:145px;right:14px;background:#c45e4d}.s4{bottom:20px;right:70px;background:#875f86}.s5{bottom:20px;left:70px;background:#4f7f9b}.s6{top:145px;left:14px;background:#39969a}.s7{top:65px;left:18px;background:#d0a13c}.s8{top:105px;left:50%;translate:-50%;margin-top:110px;background:#78966c}.feedback{padding:14px;border-radius:14px;background:#edf3e9;margin-top:12px}.metric{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric>div{padding:14px;background:#f4eee7;border-radius:16px;text-align:center}.metric strong{display:block;font-size:24px}.notice{padding:14px;border-right:4px solid var(--gold);background:#fff3d8;border-radius:12px;margin:12px 0}.parent-card{padding:20px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fffaf6ee;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:9px 8px calc(10px + env(safe-area-inset-bottom));z-index:20}nav button{border:0;background:transparent;color:#5f645e;font-size:20px;cursor:pointer}nav small{display:block;font-size:10px;margin-top:4px}.tag{font-size:12px;color:var(--green);background:#e7efe6;padding:5px 8px;border-radius:10px}@media(max-width:360px){.brand h1{font-size:27px}.grid{grid-template-columns:1fr}.tile{min-height:92px}.stage3d{height:270px}.stage{width:72px;font-size:11px}.s4{right:48px}.s5{left:48px}}@media(min-width:700px){body{padding:25px}.app{border-radius:30px;overflow:hidden;box-shadow:0 25px 70px #553b2c22;min-height:850px}nav{bottom:25px;border-radius:0 0 30px 30px}}
</style></head><body><div class="app"><header><div class="brand"><span class="leaf">◆</span><div><h1>مساري</h1><p>تعلّم يناسبني… وتقدّم نراه معًا</p></div></div><button class="ghost" id="resetBtn">↻ إعادة</button></header><main id="screen"></main><nav><button data-go="home">⌂<small>الرئيسية</small></button><button data-go="lessons">▦<small>دروسي</small></button><button data-go="progress">↗<small>تقدمي</small></button><button data-go="parent">♡<small>رحلة ابنتي</small></button></nav></div><script>
const S=document.querySelector('#screen');let state=JSON.parse(localStorage.getItem('masari')||'{"score":null,"path":null,"post":null}');const save=()=>localStorage.setItem('masari',JSON.stringify(state));
function home(){S.innerHTML=`<section class='hero'><span class='pill'>تقنية رقمية 3</span><h2>أهلًا بكِ في مساري 🌿</h2><p>ابدئي من مستواك، وتعلّمي عبر مسار يناسبك، ثم شاهدي تقدمك بالأدلة.</p><button class='cta' onclick='lessons()'>ابدئي رحلتك ←</button></section><div class='grid'><button class='tile sage' onclick='xr()'>◈<b>مختبر XR</b><small>3D والواقع المعزز</small></button><button class='tile gold' onclick='progress()'>↗<b>تقدمي</b><small>مستواك وإنجازاتك</small></button><button class='tile pink' onclick='parentView()'>♡<b>رحلة ابنتي</b><small>بوابة ولي الأمر</small></button><button class='tile blue' onclick='lessons()'>▦<b>دروسي</b><small>الوحدة الثانية</small></button></div>`}
function lessons(){S.innerHTML=`<h2>اختاري الدرس</h2><p class='tag'>الوحدة الثانية · دورة حياة النظام</p>${['مفهوم دورة حياة النظام','تحليل النظام وجمع المتطلبات','مخططات سير العمل','تصميم النظام','اختبار النظام','تنفيذ وتوثيق النظام','صيانة وتقييم النظام'].map((x,i)=>`<div class='card lesson' onclick='${i===0?'diagnostic()':'soon()'}'><b class='num'>${i+1}</b><span>${x}</span><b>‹</b></div>`).join('')}`}
function soon(){alert('سيتم فتح هذا الدرس بعد إكمال النموذج التجريبي للدرس الأول.')}
const qs=[['ما المرحلة التي تبدأ بفهم المشكلة واحتياجات المستخدم؟',['التصميم','التحليل','الاختبار','التنفيذ'],1],['تم تحديد شكل واجهات التطبيق وطريقة الانتقال بينها. ما المرحلة؟',['التحليل','التصميم','الصيانة','التقييم'],1],['تم التأكد من أن جميع وظائف النظام تعمل كما هو مطلوب. ما المرحلة؟',['التطوير','التنفيذ','الاختبار','التوثيق'],2],['ظهر خطأ بعد استخدام النظام ويحتاج إلى إصلاح وتحديث. ما المرحلة؟',['التصميم','التحليل','الصيانة','التوثيق'],2],['ما المرحلة التي تأتي بعد التصميم في المسار الأساسي؟',['التطوير','التقييم','الصيانة','التحليل'],0],['أُجريت مقابلات مع الطالبات لمعرفة احتياجاتهن قبل بناء النظام. ما المرحلة؟',['الاختبار','التحليل','التنفيذ','الصيانة'],1]];let qi=0,correct=0;
function diagnostic(){qi=0;correct=0;renderQ()}function renderQ(){let q=qs[qi];S.innerHTML=`<h2>الاختبار التشخيصي</h2><div class='progressbar'><i style='width:${qi/qs.length*100}%'></i></div><div class='card q'><span class='pill'>${qi+1} من ${qs.length}</span><h3>${q[0]}</h3>${q[1].map((o,i)=>`<button class='option' onclick='answer(${i})'>${o}</button>`).join('')}</div>`}function answer(i){if(i===qs[qi][2])correct++;qi++;if(qi<qs.length)renderQ();else result()}
function result(){let p=Math.round(correct/qs.length*100);state.score=p;state.path=p<50?'أكتشف':p<80?'أطبق':'أبتكر';save();S.innerHTML=`<div class='card q' style='text-align:center'><h2>أحسنتِ!</h2><p>تم تحديد مسارك بناءً على إجاباتك</p><div class='score' style='--p:${p}%'><strong>${p}%</strong></div><div class='path ${state.path==='أكتشف'?'discover':state.path==='أطبق'?'apply':'innovate'}'><small>مسارك اليوم</small><h3>${state.path}</h3><p>${state.path==='أكتشف'?'نبني الأساس بأمثلة مرئية وتدريب موجه.':state.path==='أطبق'?'نحوّل المعرفة إلى مواقف ومهام تطبيقية.':'نحلل ونتخذ القرار في تحديات متقدمة.'}</p></div><button class='cta' onclick='pathView()'>ابدئي مسارك ←</button></div>`}
function pathView(){S.innerHTML=`<h2>مسار ${state.path||'أطبق'}</h2><div class='card q'><span class='pill'>مفهوم دورة حياة النظام</span><h3>شاهدي المراحل كمنظومة واحدة</h3><p>اضغطي على أي مرحلة لاستكشاف معناها، ثم انتقلي إلى النشاط.</p></div>${model()}<button class='cta' onclick='activity()'>التالي: نشاط تطبيقي ←</button>`}
function model(){return `<div class='stage3d'><div class='core'>دورة حياة<br>النظام</div>${['التحليل','التصميم','التطوير','الاختبار','التنفيذ','التوثيق','التقييم','الصيانة'].map((x,i)=>`<button class='stage s${i+1}' onclick="stageInfo('${x}')">${x}</button>`).join('')}</div>`}function stageInfo(x){const m={التحليل:'فهم المشكلة وجمع احتياجات المستخدم.',التصميم:'تحديد شكل النظام وكيفية عمله.',التطوير:'بناء النظام وكتابة مكوناته.',الاختبار:'التحقق من الوظائف واكتشاف الأخطاء.',التنفيذ:'إطلاق النظام ووضعه في الاستخدام.',التوثيق:'تسجيل معلومات النظام وإرشادات استخدامه.',التقييم:'قياس جودة النظام ومدى تحقيق أهدافه.',الصيانة:'إصلاح الأخطاء وتحديث النظام بعد التشغيل.'};alert(x+'\n\n'+m[x])}
function xr(){S.innerHTML=`<h2>مختبر XR</h2><div class='card q'><span class='pill'>نموذج تفاعلي</span><h3>دورة حياة النظام ثلاثية الأبعاد</h3><p>هذه النسخة الأولى من المختبر. النموذج تفاعلي الآن، وستضاف طبقة AR بالكاميرا في مرحلة البناء التالية.</p></div>${model()}<div class='feedback'>💡 الهدف التعليمي: ربط كل إجراء بمرحلته بدل حفظ أسماء المراحل فقط.</div>`}
function activity(){S.innerHTML=`<h2>نشاط تطبيقي</h2><div class='card q'><h3>تم تشغيل التطبيق لأول مرة لدى المستخدمين. أي مرحلة يمثل ذلك؟</h3>${['التحليل','التصميم','التنفيذ','الصيانة'].map(x=>`<button class='option' onclick="checkAct('${x}')">${x}</button>`).join('')}<div id='fb'></div></div>`}function checkAct(x){let ok=x==='التنفيذ';document.querySelector('#fb').innerHTML=`<div class='feedback'>${ok?'✓ أحسنتِ، إطلاق النظام للمستخدمين يمثل مرحلة التنفيذ.':'💡 فكري مرة أخرى: نحن لا نجمع متطلبات أو نصلح النظام؛ لقد بدأ المستخدمون باستعماله.'}</div>${ok?`<button class='cta' onclick='mastery()'>بوابة الإتقان ←</button>`:''}`}
function mastery(){S.innerHTML=`<div class='card q' style='text-align:center'><h2>🏆 بوابة الإتقان</h2><p>أصبحتِ جاهزة لقياس مدى إتقانك للمهارة.</p><button class='cta' onclick='finish()'>ابدئي القياس البعدي</button></div>`}function finish(){state.post=Math.max(80,Math.min(100,(state.score||60)+25));save();progress()}
function progress(){let a=state.score??'—',b=state.post??'—';S.innerHTML=`<h2>تقدمي</h2><div class='card parent-card'><h3>دورة حياة النظام</h3><div class='metric'><div><small>البداية</small><strong>${a}${a==='—'?'':'%'}</strong></div><div><small>الحالي</small><strong>${b}${b==='—'?'':'%'}</strong></div></div>${state.post?`<div class='notice'>↑ تحسن بمقدار <b>${state.post-state.score} نقطة مئوية</b></div>`:`<p>أكملي الاختبار التشخيصي والمسار لعرض تقدمك.</p>`}</div>`}
function parentView(){S.innerHTML=`<h2>رحلة ابنتي</h2><div class='card parent-card'><span class='pill'>ولي الأمر</span><h3>تقدم ابنتكم في مهارة دورة حياة النظام</h3><div class='metric'><div><small>البداية</small><strong>${state.score??'—'}${state.score!=null?'%':''}</strong></div><div><small>الحالي</small><strong>${state.post??'—'}${state.post!=null?'%':''}</strong></div></div><div class='notice'>⭐ نقطة القوة: التمييز بين مراحل دورة حياة النظام.</div><div class='notice'>🎯 دوركم هذا الأسبوع: اطلبوا منها أن تشرح لكم كيف تنتقل فكرة نظام من التحليل حتى التنفيذ.</div><button class='cta secondary' onclick="alert('سيتم ربط هذا الزر بنموذج ملاحظة ولي الأمر في النسخة التالية.')">شاركونا ملاحظتكم</button></div>`}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>({home,lessons,progress,parent:parentView}[b.dataset.go]||home)());document.querySelector('#resetBtn').onclick=()=>{localStorage.removeItem('masari');state={score:null,path:null,post:null};home()};home();
</script></body></html>
