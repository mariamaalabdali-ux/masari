function mapJourney(){let step=Math.max(1,Math.min(5,state.journeyStep||1));let labels=['','ابدئي من هنا 👆','محطتك التالية ✨','محطتك التالية ✨','محطتك التالية ✨','المحطة الأخيرة 🏆'];return `<h3 class='section-title'>🗺️ خريطة رحلتي</h3><p class='mini-note'>رحلتك تبدأ من المحطة المضيئة ✨ اتبعي الشخصية 👩🏻‍💻</p><div class='map-wrap'><div class='road'></div><button class='map-stop ms1 ${state.score!=null?'done':step===1?'':'locked'}' onclick='diagnostic()'><i class='pin'><span>🌱</span></i><b>اكتشفي مسارك</b></button><button class='map-stop ms2 ${step>2?'done':step<2?'locked':''}' onclick='state.score!=null?pathView():tone("bad")'><i class='pin'><span>🧭</span></i><b>المسار الذكي</b></button><button class='map-stop ms3 ${step>3?'done':step<3?'locked':''}' onclick='step>=3?gamesHub():tone("bad")'><i class='pin'><span>🎮</span></i><b>مدينة الألعاب</b></button><button class='map-stop ms4 ${step>4?'done':step<4?'locked':''}' onclick='step>=4?xr():tone("bad")'><i class='pin'><span>🧊</span></i><b>مختبر XR</b></button><button class='map-stop ms5 ${state.post>=80?'done':step<5?'locked':''}' onclick='step>=5?mastery():tone("bad")'><i class='pin'><span>🏆</span></i><b>بوابة الإتقان</b></button><div class='start-hint sh${step}'>${labels[step]}</div><div class='avatar av${step}'>👩🏻‍💻</div></div>`}function home(){rememberScreen('home');syncSessionButtons();if(!state.student){profileSetup();return}let pct=Math.min(100,Math.max(8,((state.journeyStep||1)-1)*25));S.innerHTML=`${hud()}<section class='game-hero'><span class='pill'>🎮 تقنية رقمية 3</span><h2>${state.score==null?'جاهزة لبدء رحلتك؟ 🚀':'رحلتك مستمرة ✨'}</h2><p>${state.score==null?'ابدئي أول تحدٍ، واكتشفي المسار التعليمي الأنسب لكِ.':`أكملي محطاتك في مسار <b>«${state.path}»</b>، واجمعي النقاط والشارات حتى تصلي إلى بوابة الإتقان.`}</p><div class='level-line'><span>المستوى ${state.journeyStep||1}</span><div class='level-track'><i style='width:${pct}%'></i></div><span class='xp-pop'>⭐ ${state.points||0} XP</span></div><button class='ct function profileSetup(){S.innerHTML=`<section class='hero'><span class='pill'>أول خطوة 🌿</span><h2>أهلًا بكِ في مساري</h2><p>عرّفينا بكِ حتى نحفظ رحلتك ونتابع تقدمك.</p></section><div class='card profilebox'><label>الاسم الثلاثي</label><input id='studentName' class='field' maxlength='80' placeholder='اكتبي اسمك الثلاثي'><label>الفصل</label><select id='studentClass' class='field'><option value=''>اختاري الفصل</option><option>ثالث ثانوي 1</option><option>ثالث ثانوي 2</option><option>ثالث ثانوي 3</option></select><button class='cta' onclick='saveProfile()'>ابدئي رحلتك 🚀</button><div id='profileFb'></div><div class='teacher-link' onclick='teacherLogin()'>دخول المعلمة 👩🏻‍🏫</div></div>`}async function ensureStudentSession(){if(!auth)throw new Error('auth-not-ready');let u=auth.currentUser;if(!u||!u.isAnonymous){if(u)await auth.signOut();let r=await auth.signInAnonymously();u=r.user}firebaseUid=u.uid;teacherMode=false;return u}
async function saveProfile(){let name=document.querySelector('#studentName').value.trim().replace(/\\s+/g,' '),cls=document.querySelector('#studentClass').value;if(name.split(' ').length<3||!cls){tone('bad');document.querySelector('#profileFb').innerHTML=`<div class='notice'>اكتبي الاسم الثلاثي واختاري الفصل للمتابعة.</div>`;return}let fb=document.querySelector('#profileFb');try{if(fb)fb.innerHTML=`<div class='notice'>جاري إنشاء رحلتك…</div>`;await ensureStudentSession();state.student={name,className:cls};localStorage.setItem('masari',JSON.stringify(state));await syncStudent();tone('good');home()}catch(e){console.error('Student registration',e);if(fb)fb.innerHTML=`<div class='notice'>تعذر حفظ تسجيلك الآن. تحققي من الاتصال ثم حاولي مرة أخرى.</div>`}}function teacherLogin(){teacherMode=true;S.innerHTML=`<section class='hero'><span class='pill'>👩🏻‍🏫 لوحة المعلمة</span><h2>دخول المعلمة</h2><p>استخدمي حساب المعلمة المسجل في Firebase.</p></section><div class='card profilebox'><input id='te' class='field' type='email' placeholder='البريد الإلكتروني'><input id='tp' class='field' type='password' placeholder='كلمة المرور'><button class='cta' onclick='doTeacherLogin()'>دخول آمن</button><div id='tlfb'></div><button class='cta secondary' onclick='teacherMode=false;home()'>عودة للطالبة</button></div>`}

let teacherStudents=[],teacherFilter='جميع الفصول';
async function teacherDashboard(filter=teacherFilter){rememberScreen('teacher');teacherMode=true;teacherFilter=filter;S.innerHTML=`<h2>لوحة المعلمة 👩🏻‍🏫</h2><div class='notice'>جاري تحميل بيانات الطالبات…</div>`;try{let q=await db.collection('students').get();teacherStudents=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.className||'').localeCompare(b.className||'','ar')||(a.name||'').localeCompare(b.name||'','ar'));renderTeacherDashboard()}catch(e){S.innerHTML=`<h2>لوحة المعلمة</h2><div class='notice'>تعذر قراءة البيانات. تأكدي من نشر قواعد Firestore الجديدة.</div>`}}
function renderTeacherDashboard(){let classes=['جميع الفصول','ثالث ثانوي 1','ثالث ثانوي 2','ثالث ثانوي 3'];let list=teacherFilter==='جميع الفصول'?teacherStudents:teacherStudents.filter(x=>x.className===teacherFilter);S.innerHTML=`<div style='display:flex;justify-content:space-between;align-items:center'><h2>لوحة المعلمة 👩🏻‍🏫</h2><button class='ghost logout' onclick='teacherLogout()'>خروج</button></div><div class='tabs'>${classes.map(x=>`<button class='tab ${x===teacherFilter?'active':''}' onclick="teacherDashboard('${x}')">${x}</button>`).join('')}</div><div class='metric'><div><small>الطالبات</small><strong>${list.length}</strong></div><div><small>حققن الإتقان</small><strong>${list.filter(x=>(x.post||0)>=80).length}</strong></div></div><h3 class='section-title'>${teacherFilter}</h3>${list.length?list.map(x=>`<div class='card student-row' onclick="studentDetail('${x.id}')"><h3>${esc(x.name||'بدون اسم')}</h3><small>${esc(x.className||'')} · مسار ${esc(x.path||'—')}</small><div class='hud'><span>التشخيص: ${x.score??'—'}%</span><span>البعدي: ${x.post??'—'}%</span><span>⭐ ${x.points||0}</span></div><span class='status'>${(x.post||0)>=80?'🏆 متقنة':x.post!=null?'🌱 متابعة':'🧭 في الرحلة'}</span></div>`).join(''):`<div class='notice'>لا توجد طالبات مسجلات في هذا الفصل بعد.</div>`}`}

function studentDetail(id){rememberScreen('teacher');let x=teacherStudents.find(s=>s.id===id);if(!x)return;S.innerHTML=`<button class='ghost' onclick='teacherDashboard()'>← الفصول</button><h2>${esc(x.name)}</h2><p class='tag'>${esc(x.className)}</p><div class='card parent-card'><div class='metric'><div><small>التشخيص</small><strong>${x.score??'—'}%</strong></div><div><small>القياس البعدي</small><strong>${x.post??'—'}%</strong></div></div><div class='hud'><span>🧭 ${esc(x.path||'—')}</span><span>⭐ ${x.points||0} نقطة</span><span>🏅 ${(x.badges||[]).length} شارات</span></div><h3>💌 رسالة الرحلة</h3>${x.teacherNote?`<div class='teacher-note'><small>آخر رسالة مرسلة · ${esc(x.teacherNote.type||'')}</small><p>${esc(x.teacherNote.text||'')}</p><small>${esc(x.teacherNote.date||'')}</small></div>`:`<div class='notice'>لم تُرسل رسالة لهذه الطالبة بعد.</div>`}<select id='nt' class='field'><option>🌟 تعزيز</option><option>💡 توجيه</option><option>🌱 تحتاج متابعة</option><option>🏆 تميز</option></select><textarea id='nm' class='field' rows='4' placeholder='اكتبي ملاحظتك أو تعزيزك للطالبة وولي الأمر…'>${x.teacherNote?esc(x.teacherNote.text):''}</textarea><button class='cta' onclick="sendTeacherNote('${id}')">إرسال إلى رحلة ابنتي 💌</button><div id='nfb'></div><h3 style='margin-top:24px'>📚 سجل التواصل</h3>${(x.teacherMessages||[]).length?(x.teacherMessages||[]).slice().reverse().map(m=>`<div class='teacher-note'><small>${esc(m.type||'رسالة')} · ${esc(m.date||'')}</small><p>${esc(m.text||'')}</p></div>`).join(''):(x.teacherNote?`<div class='teacher-note'><small>${esc(x.teacherNote.type||'رسالة')} · ${esc(x.teacherNote.date||'')}</small><p>${esc(x.teacherNote.text||'')}</p></div>`:`<div class='notice'>لا يوجد تواصل مسجل حتى الآن.</div>`)}<hr style='border:0;border-top:1px solid var(--line);margin:24px 0'><h3 class='danger'>إدارة التسجيل</h3><p class='tag'>استخدمي الحذف فقط للتسجيلات التجريبية أو الخاطئة.</p><button class='cta secondary danger' onclick="deleteStudent('${id}')">🗑️ حذف تسجيل الطالبة</button><div id='dfb'></div></div>`}
async function sendTeacherNote(id){let type=document.querySelector('#nt').value,textv=document.querySelector('#nm').value.trim();if(!textv){document.querySelector('#nfb').innerHTML=`<div class='notice'>اكتبي الرسالة أولًا.</div>`;return}let note={type,text:textv,date:new Date().toLocaleDateString('ar-SA')};try{let x=teacherStudents.find(s=>s.id===id),history=(x&&Array.isArray(x.teacherMessages)?x.teacherMessages:[]);history=[...history,note].slice(-20);await db.collection('students').doc(id).update({teacherNote:note,teacherMessages:history});if(x){x.teacherNote=note;x.teacherMessages=history}document.querySelector('#nfb').innerHTML=`<div class='feedback'>✓ تم إرسال الرسالة وحفظها في سجل التواصل.</div>`;setTimeout(()=>studentDetail(id),650)}catch(e){document.querySelector('#nfb').innerHTML=`<div class='notice'>تعذر إرسال الرسالة.</div>`}}
async function deleteStudent(id){let x=teacherStudents.find(s=>s.id===id);if(!x)return;let ok=confirm('سيتم حذف تسجيل «'+(x.name||'الطالبة')+'» وبيانات رحلتها من لوحة المعلمة. هل أنتِ متأكدة؟');if(!ok)return;try{await db.collection('students').doc(id).delete();teacherStudents=teacherStudents.filter(s=>s.id!==id);teacherDashboard(teacherFilter)}catch(e){let el=document.querySelector('#dfb');if(el)el.innerHTML=`<div class='notice'>تعذر الحذف. يجب السماح للمعلمة بالحذف في قواعد Firestore أولًا.</div>`}}

const qs=[['ما المرحلة التي تبدأ بفهم المشكلة واحتياجات المستخدم؟',['التصميم','التحليل','الاختبار','التنفيذ'],1],['تم تحديد شكل واجهات التطبيق وطريقة الانتقال بينها. ما المرحلة؟',['التحليل','التصميم','الصيانة','التقييم'],1],['تم التأكد من أن جميع وظائف النظام تعمل كما هو مطلوب. ما المرحلة؟',['التطوير','التنفيذ','الاختبار','التوثيق'],2],['ظهر خطأ بعد استخدام النظام ويحتاج إلى إصلاح وتحديث. ما المرحلة؟',['التصميم','التحليل','الصيانة','التوثيق'],2],['ما المرحلة التي تأتي بعد التصميم في المسار الأساسي؟',['التطوير','التقييم','الصيانة','التحليل'],0],['أُجريت مقابلات مع الطالبات لمعرفة احتياجاتهن قبل بناء النظام. ما المرحلة؟',['الاختبار','التحليل','التنفيذ','الصيانة'],1]];let qi=0,correct=0;

function checkCrossword(){let a=document.querySelector('#cw1').value.trim(),b=document.querySelector('#cw2').value.trim(),ok=a==='التحليل'&&b==='الاختبار';tone(ok?'good':'bad');if(ok){let fresh=!state.badges.includes('خبيرة المصطلحات');if(fresh)award(35,'خبيرة المصطلحات');celebrate();document.querySelector('#cwfb').innerHTML=`<div class='feedback'>🏅 ممتاز! ${fresh?'حصلتِ على شارة «خبيرة المصطلحات» و35 نقطة.':'الإجابة صحيحة، والشارة محفوظة لديكِ مسبقًا.'}</div><button class='cta secondary' onclick='gamesHub()'>لعبة أخرى</button>`}else document.querySelector('#cwfb').innerHTML=`<div class='notice'>💡 راجعي التلميحين وحاولي مرة أخرى.</div>`}
let seq=[];const seqCorrect=['التحليل','التصميم','التطوير','الاختبار','التنفيذ'];function sequenceGame(){rememberScreen('sequence');seq=[];renderSeq()}function renderSeq(){let choices=seqCorrect.filter(x=>!seq.includes(x));S.innerHTML=`${hud()}<h2>🧩 تحدي الترتيب</h2><div class='card game-card'><span class='pill'>لعبة قصيرة · +30 نقطة</span><h3>ابني رحلة النظام بالترتيب</h3><p>اضغطي على المراحل بالترتيب الصحيح من البداية حتى يصبح النظام جاهزًا للاستخدام.</p><div class='slots'>${seq.length?seq.map((x,i)=>`<button class='chip selected' onclick='undoSeq(${i})'>${i+1}. ${x}</button>`).join(''):`<span class='mini-note'>اختياراتك ستظهر هنا</span>`}</div><div class='sequence'>${choices.sort(()=>.5-Math.random()).map(x=>`<button class='chip' onclick="pickSeq('${x}')">${x}</button>`).join('')}</div><div id='gameFb'></div></div>`}function pickSeq(x){seq.push(x);tone('tap');if(seq.length===seqCorrect.length)checkSeq();else renderSeq()}function undoSeq(i){seq.splice(i,1);renderSeq()}function checkSeq(){let ok=seq.every((x,i)=>x===seqCorrect[i]);if(ok){if(!state.gameDone){state.gameDone=true;award(30,'مهندسة المراحل')}celebrate();S.innerHTML=`${hud()}<div class='card game-card' style='text-align:center'><div style='font-size:52px'>🏅</div><h2>رائعة!</h2><p>رتبتِ رحلة النظام بنجاح وفتحتِ شارة <b>مهندسة المراحل</b>.</p><button class='cta' onclick='activity()'>المهمة التالية 🚀</button></div>`}else{tone('bad');S.innerHTML=`${hud()}<div class='card game-card'><h2>قريبة جدًا 🌱</h2><p>الترتيب يحتاج مراجعة. تذكري: نفهم أولًا، ثم نصمم، ثم نبني، ثم نختبر، وبعدها نطلق.</p><button class='cta' onclick='sequenceGame()'>حاولي مرة أخرى</button></div>`}}

function activity(){rememberScreen('activity');S.innerHTML=`<h2>نشاط تطبيقي</h2><div class='card q'><h3>تم تشغيل التطبيق لأول مرة لدى المستخدمين. أي مرحلة يمثل ذلك؟</h3>${['التحليل','التصميم','التنفيذ','الصيانة'].map(x=>`<button class='option' onclick="checkAct('${x}')">${x}</button>`).join('')}<div id='fb'></div></div>`}function checkAct(x){let ok=x==='التنفيذ';tone(ok?'good':'bad');if(ok){if(!state.badges.includes('محللة المواقف'))award(15,'محللة المواقف');setTimeout(celebrate,180);}document.querySelector('#fb').innerHTML=`<div class='feedback'>${ok?'✓ أحسنتِ، إطلاق النظام للمستخدمين يمثل مرحلة التنفيذ.':'💡 فكري مرة أخرى: نحن لا نجمع متطلبات أو نصلح النظام؛ لقد بدأ المستخدمون باستعماله.'}</div>${ok?`<button class='cta' onclick='mastery()'>بوابة الإتقان ←</button>`:''}`}
const postQs=[
['بدأ فريق مشروع بسؤال المستخدمين عن المشكلات التي يواجهونها. ما المرحلة؟',['التصميم','التحليل','التنفيذ','الصيانة'],1],
['حوّل الفريق المتطلبات إلى تصور للواجهات وطريقة عمل النظام. ما المرحلة؟',['التصميم','الاختبار','التقييم','التوثيق'],0],
['بعد بناء النظام جُرّبت وظائفه للتأكد من خلوها من الأخطاء. ما المرحلة؟',['التطوير','الاختبار','التنفيذ','التحليل'],1],
['أصبح النظام متاحًا للمستخدمين وبدأ العمل عليه فعليًا. ما المرحلة؟',['التنفيذ','التوثيق','الصيانة','التصميم'],0],
['بعد فترة من الاستخدام ظهر خلل وأصدر الفريق تحديثًا لإصلاحه. ما المرحلة؟',['الاختبار','التحليل','الصيانة','التطوير'],2]
];let pi=0,pc=0;
function mastery(){rememberScreen('mastery');state.journeyStep=Math.max(state.journeyStep||1,5);save();S.innerHTML=`<div class='card q' style='text-align:center'><h2>🏆 بوابة الإتقان</h2><p>الآن سنقيس ما تعلمتِه فعلًا. النتيجة تُحسب من إجاباتك.</p><div class='notice'>درجة الإتقان المستهدفة: 80٪</div><button class='cta' onclick='startPost()'>ابدئي القياس البعدي</button></div>`}
function startPost(){pi=0;pc=0;state.postAnswers=[];renderPost()}
function renderPost(){let q=postQs[pi];S.innerHTML=`<h2>القياس البعدي</h2><div class='progressbar'><i style='width:${pi/postQs.length*100}%'></i></div><div class='card q'><span class='pill'>${pi+1} من ${postQs.length}</span><h3>${q[0]}</h3>${q[1].map((o,i)=>`<button class='option' onclick='postAnswer(${i})'>${o}</button>`).join('')}</div>`}
function postAnswer(i){let ok=i===postQs[pi][2];tone(ok?'good':'bad');if(ok)pc++;state.postAnswers.push({q:pi,ok});pi++;if(pi<postQs.length)renderPost();else postResult()}
function postResult(){state.post=Math.round(pc/postQs.length*100);state.attempts=(state.attempts||0)+1;save();let mastered=state.post>=80;if(mastered){if(!state.badges.includes('متقنة الدرس'))award(50,'متقنة الدرس');setTimeout(celebrate,120)}S.innerHTML=`<div class='card q' style='text-align:center'><h2>${mastered?'🎉 تم الإتقان':'🌱 نحتاج خطوة علاجية'}</h2><div class='score' style='--p:${state.post}%'><strong>${state.post}%</strong></div><p>هذه نتيجتك الفعلية في القياس البعدي.</p>${mastered?`<div class='feedback'>أحسنتِ، حققتِ معيار الإتقان 80٪ فأعلى.</div><button class='cta' onclick='progress()'>شاهدي تقدمك ←</button>`:`<div class='notice'>سنراجع النقاط التي أخطأتِ فيها ثم نعيد القياس.</div><button class='cta' onclick='remedial()'>ابدئي التدخل العلاجي ←</button>`}</div>`}
function remedial(){let weak=state.postAnswers.filter(x=>!x.ok).map(x=>x.q);const tips=['التحليل يسبق البناء: نفهم المشكلة واحتياجات المستخدم أولًا.','التصميم يحول المتطلبات إلى تصور واضح لشكل النظام وطريقة عمله.','الاختبار يتحقق من أن وظائف النظام تعمل ويكشف الأخطاء.','التنفيذ يعني وضع النظام في الاستخدام الفعلي لدى المستخدمين.','الصيانة تحدث بعد الاستخدام لإصلاح الأخطاء وإجراء التحديثات.'];S.innerHTML=`<h2>تدخلك العلاجي</h2><div class='card q'><span class='pill'>مخصص حسب إجاباتك</span><h3>راجعي فقط ما يحتاج إلى تعزيز</h3>${weak.map(i=>`<div class='notice'>💡 ${tips[i]}</div>`).join('')}<button class='cta' onclick='startPost()'>أعيدي القياس ←</button></div>`}
function progress(){rememberScreen('progress');let a=state.score??'—',b=state.post??'—';S.innerHTML=`${hud()}<h2>تقدمي</h2><div class='card parent-card'><h3>دورة حياة النظام</h3><div class='metric'><div><small>البداية</small><strong>${a}${a==='—'?'':'%'}</strong></div><div><small>الحالي</small><strong>${b}${b==='—'?'':'%'}</strong></div></div>${state.post?`<div class='notice'>↑ تحسن بمقدار <b>${state.post-state.score} نقطة مئوية</b></div>`:`<p>أكملي الاختبار التشخيصي والمسار لعرض تقدمك.</p>`}</div><h3 class='section-title'>شاراتي</h3><div class='badge-grid'>${[['🌱','مستكشفة المسار'],['🧩','مهندسة المراحل'],['🗺️','مستكشفة المتاهة'],['🔤','خبيرة المصطلحات'],['🎯','محللة المواقف'],['🏆','متقنة الدرس']].map(b=>`<div class='badge ${state.badges.includes(b[1])?'earned':''}'><b>${b[0]}</b><small>${b[1]}</small></div>`).join('')}</div>`}
async function parentView(){rememberScreen('parent');S.innerHTML=`<h2>رحلة ابنتي</h2><div class='notice'>جاري تحديث رحلة ابنتكم…</div>`;if(firebaseUid&&!teacherMode)await loadTeacherNote();S.innerHTML=`<h2>رحلة ابنتي</h2><p class='tag'>${state.student?state.student.name:''} · ${state.student?state.student.className:''}</p><div class='card parent-card'><span class='pill'>ولي الأمر</span><h3>تقدم ابنتكم في مهارة دورة حياة النظام</h3><div class='metric'><div><small>البداية</small><strong>${state.score??'—'}${state.score!=null?'%':''}</strong></div><div><small>الحالي</small><strong>${state.post??'—'}${state.post!=null?'%':''}</strong></div></div><div class='notice'>⭐ نقطة القوة: التمييز بين مراحل دورة حياة النظام.</div><div class='notice'>🎯 دوركم هذا الأسبوع: اطلبوا منها أن تشرح لكم كيف تنتقل فكرة نظام من التحليل حتى التنفيذ.</div>${state.teacherNote?`<div class='teacher-note'><small>💌 رسالة من المعلمة · ${esc(state.teacherNote.type||'')}</small><p>${esc(state.teacherNote.text||'')}</p><small>${esc(state.teacherNote.date||'')}</small></div>`:`<div class='notice'>💌 لا توجد رسالة جديدة من المعلمة حتى الآن.</div>`}<button class='cta secondary' onclick="alert('سيتم ربط هذا الزر بنموذج ملاحظة ولي الأمر في النسخة التالية.')">شاركونا ملاحظتكم</button></div>`}
const soundBtn=document.querySelector('#soundBtn');function syncSound(){soundBtn.textContent=soundOn?'🔊':'🔇';soundBtn.title=soundOn?'الأصوات مفعلة':'الأصوات متوقفة'}soundBtn.onclick=()=>{soundOn=!soundOn;localStorage.setItem('masariSound',soundOn?'on':'off');syncSound();if(soundOn)tone('good')};syncSound();document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>({home,lessons,progress,parent:parentView}[b.dataset.go]||home)());document.querySelector('#resetBtn').onclick=()=>{if(!confirm('هل تريدين إعادة رحلتك التعليمية من البداية؟'))return;state={score:null,path:null,post:null,postAnswers:[],attempts:0,points:0,badges:[],gameDone:false,student:state.student,journeyStep:1,teacherNote:state.teacherNote||null};save();home()};document.querySelector('#studentLogoutBtn').onclick=studentLogout;async function studentLogout(){if(!state.student||teacherMode)return;if(!confirm('هل تريدين تسجيل الخروج من هذا الجهاز؟ سيبقى تقدمك محفوظًا لدى المعلمة.'))return;try{await syncStudent();if(auth&&auth.currentUser)await auth.signOut()}catch(e){console.error(e)}firebaseUid=null;localStorage.removeItem('masari');state={score:null,path:null,post:null,postAnswers:[],attempts:0,points:0,badges:[],gameDone:false,student:null,journeyStep:1,teacherNote:null};syncSessionButtons();profileSetup()}home();initFirebase();
</script></body></html>
